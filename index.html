<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="ShopFlow — e-commerce local-first em MVC.">
  <title>ShopFlow</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="Abrir menu">☰</button>
    <button id="brandBtn" class="brand" aria-label="Ir para início">ShopFlow</button>
    <button id="cartBtn" class="icon-btn" aria-label="Abrir carrinho">🛒<span id="cartBadge" class="badge">0</span></button>
  </header>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head"><strong>ShopFlow</strong><button id="closeDrawer" class="icon-btn">✕</button></div>
    <nav id="mainNav" class="main-nav">
      <button data-route="home">🏠 Início</button>
      <button data-route="cart">🛒 Carrinho</button>
      <button data-route="orders">📦 Meus pedidos</button>
      <button data-route="recordings">🎙️ Gravações</button>
      <button data-route="settings">⚙️ Configurações</button>
    </nav>
  </aside>
  <div id="backdrop" class="backdrop hidden"></div>

  <main id="app" class="app-shell"></main>

  <!-- FAB: controle explícito do gravador -->
  <button id="recordFab" class="record-fab" aria-label="Iniciar gravação" title="Gravar áudio">🎙️</button>
  <div id="recordPill" class="record-pill" hidden>
    <span class="live-dot"></span><span id="recordPillText">Microfone ativo</span><span id="recordTimer">00:00</span>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
